[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modpods"
version = "1.3.0"
description = "Model Discovery in Partially Observable Dynamical Systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.0",
    "control>=0.9",
    "cvxpy>=1.3",
    "networkx>=3.0",
    "types-requests",
    "pandas-stubs",
    "scipy-stubs",
    "types-networkx",
]

[project.optional-dependencies]
numba = ["numba>=0.58"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modpods*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
exclude = "\\.venv|modpods_backup\\.py"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "modpods_backup.py",
    "*.TMP",
    "*.h11~",
    "*.qeb~",
    "*.wa0~",
    ".vs",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
no_strict_optional = true
warn_return_any = true
check_untyped_defs = true
explicit_package_bases = true
exclude = [
    "modpods_backup\\.py",
    ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (uses large data files or long simulations)",
]
